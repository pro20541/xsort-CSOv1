<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSO Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    color: #f1f1f1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(270deg, #0f2027, #203a43, #2c5364, #6c5ce7, #9b59ff);
    background-size: 1000% 1000%;
    animation: gradientMove 30s ease infinite;
}
@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.login-container {
    background: rgba(0,0,0,0.7);
    padding: 40px;
    border-radius: 12px;
    width: 320px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    text-align: center;
}

h2 {
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 20px;
    color: #9b59ff;
}

input {
    display: block;
    margin: 10px 0;
    padding: 10px;
    width: 100%;
    border-radius: 6px;
    border: none;
    font-size: 14px;
}

button {
    margin-top: 15px;
    padding: 10px;
    width: 100%;
    border-radius: 6px;
    border: none;
    background: #9b59ff;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease;
}
button:hover {
    background: #8e44ff;
}

.flash-message {
    margin-top: 10px;
    padding: 8px;
    border-radius: 5px;
    font-size: 14px;
}
.flash-success { background: rgba(0,255,0,0.3); color: #0f0; }
.flash-error { background: rgba(255,0,0,0.3); color: #f00; }
</style>
</head>
<body>

<div class="login-container">
    <h2>CSO Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
